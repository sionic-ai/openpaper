name: Release

# Push a tag that matches the app version (v + version in src-tauri/tauri.conf.json):
#   git tag v0.2.1 && git push origin v0.2.1
# Run it by hand (workflow_dispatch) to build the Windows installer as a workflow artifact
# without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Fail in seconds, not after the universal build, when the tag or a version file is off.
      - run: scripts/check-versions.sh "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Same script maintainers run locally: universal build, zip, .sha256, GitHub release.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENPAPER_REPO: ${{ github.repository }}
        run: scripts/release.sh "$GITHUB_REF_NAME"

  # Adds the Windows installer to the release the macOS job created. The in-app updater on
  # Windows downloads this exact asset name and checks it against its .sha256.
  windows:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.ref_type != 'tag') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      ASSET: OpenPaper-windows-x64-setup.exe
    steps:
      - uses: actions/checkout@v4
      - if: github.ref_type == 'tag'
        run: scripts/check-versions.sh "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build the installer
        run: pnpm tauri build --bundles nsis
      - name: Name it and write its checksum
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/OpenPaper_*_x64-setup.exe "out/$ASSET"
          cd out && sha256sum "$ASSET" | sed 's/ \*/  /' > "$ASSET.sha256" && cat "$ASSET.sha256"
      - if: github.ref_type == 'tag'
        name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "out/$ASSET" "out/$ASSET.sha256" -R "$GITHUB_REPOSITORY" --clobber
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: openpaper-windows
          path: out/
